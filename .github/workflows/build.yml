name: V4A Switch bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: APK und Magisk-Modul bauen
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: V4A-Profile-Switch-Modul
          path: dist/*.zip
